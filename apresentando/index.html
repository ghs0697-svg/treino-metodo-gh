<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O app do Método GH</title>
<meta name="description" content="Veja por dentro o app do Método GH e tudo que tu recebe na consultoria.">
<meta property="og:title" content="O app do Método GH">
<meta property="og:description" content="Veja por dentro o app e tudo que tu recebe na consultoria.">
<meta property="og:image" content="https://app.metodogh.com.br/apresentando/capa.jpg">
<meta property="og:type" content="video.other">
<meta property="og:video" content="https://app.metodogh.com.br/videos-lite/apresentando-o-app.mp4">
<meta property="og:video:type" content="video/mp4">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bg:#F7F5F0; --fg:#1A1712; --fg2:#6B6455; --gold:#A8842F; --card:#FFFFFF; --line:#E7E1D3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px max(16px, env(safe-area-inset-left)) 40px max(16px, env(safe-area-inset-right)); display:flex; flex-direction:column; align-items:center; gap:16px; }
  .logo { width:56px; height:56px; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  h1 { margin:0; font-size:24px; text-align:center; }
  h1 span { color:var(--gold); }
  .vid { width:100%; max-width:420px; aspect-ratio:9/16; border-radius:18px; overflow:hidden; background:#000; box-shadow:0 10px 30px rgba(0,0,0,.15); }
  video { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
  .sub { margin:0; color:var(--fg2); font-size:14px; text-align:center; }
  .btn { display:inline-block; padding:12px 18px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-weight:600; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon-192.png" alt="Método GH">
  <h1>O app do <span>Método GH</span></h1>
  <div class="vid">
    <video controls playsinline preload="metadata" poster="capa.jpg">
      <source src="/videos-lite/apresentando-o-app.mp4" type="video/mp4">
    </video>
  </div>
  <p class="sub">Toca no play pra assistir. Se não abrir aqui, toca no botão abaixo.</p>
  <a class="btn" href="/videos-lite/apresentando-o-app.mp4">Abrir o vídeo direto</a>
</main>
</body>
</html>
